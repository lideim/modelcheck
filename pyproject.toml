[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelcheck"
version = "1.0.1"
description = "Проверка: настоящая ли нейросеть за API-ключом — Claude, GPT, Gemini, DeepSeek и ещё 14 производителей"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lideim" }]
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13"]
keywords = ["llm", "api", "claude", "openai", "gemini", "deepseek", "fingerprint", "proxy", "reseller", "verification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lideim/modelcheck"
Issues = "https://github.com/lideim/modelcheck/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
modelcheck = "modelcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelcheck"]

[tool.hatch.build.targets.sdist]
include = ["src/modelcheck", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
